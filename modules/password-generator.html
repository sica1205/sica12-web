<div class="password-generator">

  <div class="password-head">
    <span class="password-kicker">SECURITY UTILITY</span>
    <h2>Password Generator</h2>
    <p>
      Generează o parolă pe care n-o să ți-o amintești niciodată.
      Exact cum trebuie.
    </p>
  </div>


  <div class="password-output-card">

    <span class="password-label">GENERATED PASSWORD</span>

    <div class="password-output-row">

      <input
        type="text"
        id="password-output"
        readonly
        spellcheck="false"
        autocomplete="off"
      >

      <button
        type="button"
        class="password-copy"
        id="password-copy"
      >
        COPY
      </button>

    </div>


    <div class="password-strength">

      <div class="password-strength-head">
        <span>STRENGTH</span>
        <span id="password-strength-text">STRONG</span>
      </div>

      <div class="password-strength-track">
        <div
          class="password-strength-fill"
          id="password-strength-fill"
        ></div>
      </div>

      <div class="password-stats">
        <span id="password-entropy">~0 bits</span>
        <span id="password-pool">0 possible chars</span>
      </div>

    </div>

  </div>


  <div class="password-grid">


    <!-- LENGTH -->

    <div class="password-panel">

      <div class="password-panel-head">
        <span class="password-label">LENGTH</span>

        <strong id="password-length-value">
          20
        </strong>
      </div>


      <input
        type="range"
        id="password-length"
        min="6"
        max="64"
        value="20"
        step="1"
      >


      <div class="password-range-labels">
        <span>6</span>
        <span>64</span>
      </div>

    </div>



    <!-- CHARACTER SETS -->

    <div class="password-panel">

      <span class="password-label">
        CHARACTER SETS
      </span>


      <div class="password-options">


        <label class="password-option">

          <input
            type="checkbox"
            id="password-lowercase"
            checked
          >

          <span class="password-checkbox"></span>

          <span>
            Lowercase
            <small>a-z</small>
          </span>

        </label>


        <label class="password-option">

          <input
            type="checkbox"
            id="password-uppercase"
            checked
          >

          <span class="password-checkbox"></span>

          <span>
            Uppercase
            <small>A-Z</small>
          </span>

        </label>


        <label class="password-option">

          <input
            type="checkbox"
            id="password-numbers"
            checked
          >

          <span class="password-checkbox"></span>

          <span>
            Numbers
            <small>0-9</small>
          </span>

        </label>


        <label class="password-option">

          <input
            type="checkbox"
            id="password-symbols"
            checked
          >

          <span class="password-checkbox"></span>

          <span>
            Symbols
            <small>!@#$...</small>
          </span>

        </label>


      </div>

    </div>



    <!-- EXTRA -->

    <div class="password-panel password-extra-panel">

      <span class="password-label">
        EXTRA
      </span>


      <label class="password-option">

        <input
          type="checkbox"
          id="password-ambiguous"
        >

        <span class="password-checkbox"></span>

        <span>
          Exclude ambiguous characters
          <small>0 O o 1 l I</small>
        </span>

      </label>

    </div>


  </div>


  <button
    type="button"
    class="password-generate"
    id="password-generate"
  >
    ↻ GENERATE PASSWORD
  </button>


  <div
    class="password-toast"
    id="password-toast"
    aria-live="polite"
  >
    COPIED
  </div>

</div>
